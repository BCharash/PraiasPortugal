<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sky preview — Praias de Portugal</title>
    <link rel="stylesheet" href="sky-preview.css">
    <script src="sky-fixtures.js" defer></script>
    <script src="sky-preview.js" defer></script>
</head>
<body>
    <header class="preview-controls">
        <strong>Sky lab · Checkpoint 3</strong>
        <label for="fixtureSelect">Fixed weather</label>
        <select id="fixtureSelect" disabled></select>
        <button id="resetPreview" type="button" disabled>Reset preview</button>
        <label><input id="skyEnabled" type="checkbox" checked> Show sky</label>
        <label><input id="skyMotion" type="checkbox" checked> Animate sky</label>
        <label for="panelOpacity">Panel opacity</label>
        <input id="panelOpacity" type="range" min="0" max="100" step="5" value="30">
        <output id="panelOpacityValue" for="panelOpacity">30%</output>
        <span id="previewStatus" role="status">Loading actual app layout…</span>
        <small>Fixtures only · Temporary settings · Uncheck sky to compare original background</small>
    </header>
    <iframe id="previewFrame" title="Praias de Portugal fixture preview"></iframe>
</body>
</html>
