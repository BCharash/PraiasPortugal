<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================================
         Document Metadata
    =========================================================== -->

    <meta charset="UTF-8">

    <!-- ==========================================================
     Icon Implementation
    ========================================================== -->

    <link rel="icon"
          type="image/png"
          href="icons/favicon.png">

    <link rel="manifest"
          href="manifest.json">

    <link rel="apple-touch-icon"
          href="icons/apple-touch-icon.png">

  

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Praias de Portugal</title>

    <!-- Application Styles -->

    <link rel="stylesheet" href="src/css/base.css">

    <link rel="stylesheet"
      href="src/css/layout.css">

    <link rel="stylesheet"
      href="src/css/components.css">

    <link rel="stylesheet"
      href="src/css/conditions.css">

    <link rel="stylesheet"
      href="src/css/dashboard.css">


    <link rel="stylesheet"
          href="src/css/styles.css">

</head>


<body>


    <!-- ==========================================================
         Application Navigation
    =========================================================== -->

    <header id="applicationHeader">

        <nav id="mainNavigation">

            <button id="dashboardNavButton"
                    type="button"
                    data-i18n="dashboard">
                Dashboard
            </button>

            <button id="beachesNavButton"
                    type="button"
                    data-i18n="beaches">
                Beaches
            </button>

            <button id="settingsNavButton"
                    type="button"
                    data-i18n="settings">
                Settings
            </button>

            <div id="textSizeControl">

                <span class="text-size-icon-small"
                      aria-hidden="true">
                    A
                </span>

                <input type="range"
                       id="textSizeSlider"
                       min="0"
                       max="3"
                       step="1"
                       value="1"
                       aria-label="Text size">

                <span class="text-size-icon text-size-icon-large"
                      aria-hidden="true">
                    A
                </span>

            </div>     
                   
        </nav>

    </header>


    <!-- ==========================================================
         Dashboard Page
    =========================================================== -->

    <main id="dashboardPage">

        <div id="dashboard">


            <!-- ==================================================
                 Dashboard Status
            =================================================== -->

            <div id="dashboardStatus">

                <div id="dashboardBeachName">
                    No beach selected
                </div>

                <div id="dashboardAlerts"
                     data-i18n="noActiveAlerts">
                    No active alerts
                </div>

            </div>


            <!-- ==================================================
                 Alert Widget

                 Hidden during normal conditions.
                 Displayed when an actual alert exists.
            =================================================== -->

            <div id="alertsWidget"
                 class="dashboard-widget"
                 hidden>

                <h3 data-i18n="alerts">
                    Alerts
                </h3>

                <p id="alertMessage">
                    --
                </p>

            </div>

 
        <!-- ==================================================
                Conditions Section
            =================================================== -->

            <div id="conditionsWidget"
                class="dashboard-widget">

                <div id="celestialSky">

                    <div id="celestialGraphic"></div>


                    <div id="conditionsOverlay">


                        <!-- ==================================================
                            Upper Conditions Panel
                        =================================================== -->

                        <div id="upperConditionsPanel">


                            <!-- ==============================================
                                Temperature
                            =============================================== -->

                            <div id="temperaturePanel">

                            <div id="dashboardTemperatureRange">

                                <div id="dashboardTempMin">
                                    --
                                </div>


                            <div id="dashboardTempTrack">

                                <div id="dashboardTempMarker"></div>

                                <div id="dashboardAirTempAnchor">

                                    <div id="dashboardAirTemp">
                                        --
                                    </div>

                                </div>

                            </div>

                            <div id="dashboardTempMax">
                                --
                            </div>



                            </div>


                                <<div id="temperatureSecondaryRow">

                                    <div id="dashboardAirFeelsLike"
                                        class="metric-secondary">
                                        --
                                    </div>

                                    <div id="dashboardAirHumidity"
                                        class="metric-secondary">
                                        --
                                    </div>

                                </div>

                            </div>


                            <!-- ==============================================
                                Current Conditions
                            =============================================== -->

                            <div id="currentConditionsPanel">

                                <div id="dashboardWeatherIcon"
                                    aria-hidden="true">
                                    ☁️
                                </div>

                                <div id="dashboardWeatherCondition">
                                    --
                                </div>

                                <div id="dashboardCoastalCondition"
                                    class="metric-secondary">
                                    --
                                </div>

                            </div>


                            <!-- ==============================================
                                UV
                            =============================================== -->

                            <div id="uvPanel">

                                <div id="conditionsUV">

                                    <div id="dashboardUV">
                                        --
                                    </div>

                                </div>

                            </div>


                        </div>


                        <!-- ==================================================
                            Lower Weather / Celestial Panel
                        =================================================== -->

                        <div id="lowerWeatherCelestialPanel">


                            <!-- ==================================================
                                Sun
                            =================================================== -->

                            <div id="conditionsSun">

                                <div id="dashboardSunrise">
                                    --
                                </div>

                                <div id="dashboardSunset">
                                    --
                                </div>

                            </div>


                            <!-- ==================================================
                                Moon
                            =================================================== -->

                            <div id="conditionsMoon">

                                <div id="dashboardMoonPhase">
                                    --
                                </div>

                                <div id="dashboardMoonIllumination"
                                    class="metric-secondary">
                                    --
                                </div>

                            </div>


                        </div>


                    </div>  <!-- conditionsOverlay -->


                </div>      <!-- celestialSky -->


            </div>          <!-- conditionsWidget -->

            <!-- ==================================================
                 Dashboard Data Cards
            =================================================== -->

            <div id="dashboardDataCards">


                <!-- ==================================================
                     Wind
                =================================================== -->

                <div id="windCard"
                     class="dashboard-data-card">

                    <div class="dashboard-card-label">
                        WIND
                    </div>

                    <div id="dashboardWind">
                        --
                    </div>

                </div>


                <!-- ==================================================
                     Sea
                =================================================== -->

                <div id="seaCard"
                     class="dashboard-data-card">

                    <div class="dashboard-card-label">
                        SEA
                    </div>

                    <div id="dashboardSeaTemp">
                        --
                    </div>

                </div>


                <!-- ==================================================
                     Surf
                =================================================== -->

                <div id="surfCard"
                     class="dashboard-data-card">

                    <div class="dashboard-card-label">
                        SURF
                    </div>

                    <div id="dashboardSurf">
                        --
                    </div>

                </div>


                <!-- ==================================================
                     Tide
                =================================================== -->

                <div id="tideCard"
                     class="dashboard-data-card">

                    <div class="dashboard-card-label">
                        TIDE
                    </div>

                    <div id="dashboardTide">
                        --
                    </div>

                </div>


            </div>   
            
        </div>          <!-- dashboard -->


    </main>             <!-- dashboardPage -->



    <!-- ==========================================================
         Beaches Page
    =========================================================== -->

    <main id="beachesPage"
          hidden>

        <h2 data-i18n="beaches">
            Beaches
        </h2>


        <!-- ======================================================
             Beach Selection
        ======================================================= -->

        <div id="beachSelection">

            <h3 data-i18n="selectBeach">
                Select Beach
            </h3>


            <!-- ==================================================
                 Region
            =================================================== -->

            <div>

                <label for="regionSelect"
                       data-i18n="region">
                    <strong>Region:</strong>
                </label>

                <br>

                <select id="regionSelect"></select>

            </div>


            <br>


            <!-- ==================================================
            Area
            =================================================== -->

            <div>

                <label for="areaSelect"
                    data-i18n="beachComplex">
                    <strong>Area:</strong>
                </label>

                <br>

                <select id="areaSelect"></select>

            </div>

            <!-- ==================================================
                 Beach
            =================================================== -->

            <div>

                <label for="beachSelect"
                       data-i18n="beach">
                    <strong>Beach:</strong>
                </label>

                <br>

                <select id="beachSelect"></select>

            </div>


            <br>


            <!-- ==================================================
                 Favorites
            =================================================== -->

            <div>

                <label for="favoriteBeachSelect"
                       data-i18n="favorites">
                    <strong>Favorites:</strong>
                </label>

                <br>

                <select id="favoriteBeachSelect">

                    <option value=""
                            data-i18n="Select Favorite">
                        Select a favorite
                    </option>

                </select>

            </div>

        </div>


        <!-- ======================================================
             Selected Beach Information
        ======================================================= -->

        <div id="selectedBeachInformation"
             class="dashboard-widget">

            <div id="selectedBeachTitle">

                <h3 data-i18n="selectedBeach">
                    Selected Beach
                </h3>

                <button id="favoriteBeachButton"
                        type="button"
                        aria-label="Add to favorites"
                        title="Add to favorites">
                    ♡
                </button>

            </div>


            <p>

                <strong data-i18n="region">
                    Region:
                </strong>

                <span id="region"></span>

            </p>


            <p>

                <strong data-i18n="municipality">
                    Municipality:
                </strong>

                <span id="municipality"></span>

            </p>


            <p>

                <strong data-i18n="district">
                    District:
                </strong>

                <span id="district"></span>

            </p>


            <p>

                <strong data-i18n="latitude">
                    Latitude:
                </strong>

                <span id="latitude"></span>

            </p>


            <p>

                <strong data-i18n="longitude">
                    Longitude:
                </strong>

                <span id="longitude"></span>

            </p>
             
            <br>


            <a id="viewOnMapLink"
                href="#"
                target="_blank"
                rel="noopener">
            📍 View on map
        </a>

        </div>

    </main>


    <!-- ==========================================================
         Settings Page
    =========================================================== -->

    <main id="settingsPage"
          hidden>

        <h2 data-i18n="settings">
            Settings
        </h2>


        <!-- ======================================================
             Units
        ======================================================= -->

        <section id="unitSettings"
                 class="settings-section">

            <h3 data-i18n="units">
                Units
            </h3>


            <div>

                <label for="temperatureUnitSelect"
                       data-i18n="temperature">
                    Temperature:
                </label>

                <select id="temperatureUnitSelect">

                    <option value="celsius"
                            data-i18n="celsius">
                        Celsius (°C)
                    </option>

                    <option value="fahrenheit"
                            data-i18n="fahrenheit">
                        Fahrenheit (°F)
                    </option>

                </select>

            </div>

            <div>

                <label for="windSpeedUnitSelect"
                       data-i18n="windSpeed">
                    Wind speed:
                </label>

                <select id="windSpeedUnitSelect">

                    <option value="kmh"
                            data-i18n="kmh">
                        km/h
                    </option>

                    <option value="knots"
                            data-i18n="knots">
                        knots
                    </option>

                    <option value="mph"
                            data-i18n="mph">
                        mph
                    </option>

                </select>

            </div>


            <div>

                <label for="waveHeightUnitSelect"
                       data-i18n="height">
                    Height:
                </label>

                <select id="waveHeightUnitSelect">

                    <option value="meters"
                            data-i18n="meters">
                        metres (m)
                    </option>

                    <option value="feet"
                            data-i18n="feet">
                        feet (ft)
                    </option>

                </select>

            </div>

        </section>


        <!-- ======================================================
             Startup Preferences
        ======================================================= -->

        <section id="startupSettings"
                 class="settings-section">

            <h3 data-i18n="startup">
                Startup
            </h3>


            <div>

                <label for="startupPageSelect"
                       data-i18n="startupPage">
                    Startup page:
                </label>

                <select id="startupPageSelect">

                    <option value="dashboard"
                            data-i18n="dashboard">
                        Dashboard
                    </option>

                    <option value="beaches"
                            data-i18n="beaches">
                        Beaches
                    </option>

                </select>

            </div>


            <br>


            <div>

                <label for="startupBeachSelect"
                       data-i18n="startupBeach">
                    Startup beach:
                </label>

                <select id="startupBeachSelect">

                    <option value="last"
                            data-i18n="lastSelectedBeach">
                        Last selected beach
                    </option>

                </select>

            </div>

            
        </section>


        
        <!-- ======================================================
             Language
        ======================================================= -->

        <section id="languageSettings"
                 class="settings-section">

            <h3 data-i18n="language">
                Language
            </h3>


            <div>

                <label for="languageSelect"
                       data-i18n="language">
                    Language:
                </label>

                <select id="languageSelect">

                    <option value="en"
                            data-i18n="english">
                        English
                    </option>

                    <option value="pt"
                            data-i18n="portuguese">
                        Português
                    </option>

                </select>

            </div>

        </section>

    </main>


    <!-- ==========================================================
         JavaScript Modules
    =========================================================== -->


    <!-- Data -->

    <script src="src/js/data.js"></script>


    <!-- Services -->

    <script src="src/js/weatherService.js"></script>

    <script src="src/js/celestialService.js"></script>

    <script src="src/js/coastalConditions.js"></script>

    <script src="src/js/marineService.js"></script>

    <script src="src/js/tideService.js"></script>


    <!-- Formatters -->

    <script src="src/js/celestialFormatter.js"></script>

    <script src="src/js/weatherFormatter.js"></script>

    <script src="src/js/marineFormatter.js"></script>

    <script src="src/js/tideFormatter.js"></script>


    <!-- Browser -->

    <script src="src/js/browse.js"></script>

    <script src="src/js/display.js"></script>


    <!-- Dashboard -->

    <script src="src/js/beachHeader.js"></script>

    <script src="src/js/alerts.js"></script>

    <script src="src/js/conditions.js"></script>

    <script src="src/js/dashboard.js"></script>


    <!-- Application -->

    <script src="src/js/background.js"></script>

    <script src="src/js/app.js"></script>


</body>

</html>
